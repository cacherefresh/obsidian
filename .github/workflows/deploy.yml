name: Deploy sanctuary → live
on:
  push:
    branches:
      - sanctuary
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Merge sanctuary → live
        run: |
          git fetch origin
          git checkout live
          git merge origin/sanctuary --no-edit
          git push origin live
